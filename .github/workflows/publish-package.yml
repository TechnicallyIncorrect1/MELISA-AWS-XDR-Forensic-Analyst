name: Publish Package

on:
  push:
    branches: [ main ]
    paths:
      - '**.ps1'
      - '**.psm1'
      - '**.psd1'
  pull_request:
    branches: [ main ]

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup PowerShell
        uses: microsoft/setup-powershell@v1

      - name: Test Module
        run: |
          Import-Module .\ScubaGear.psd1 -Force
          Write-Host "✅ Module loaded successfully"
