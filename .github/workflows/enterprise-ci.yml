name: MELISA Enterprise CI/CD + Monitoring

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
      - uses: github/codeql-action/analyze@v3

  build-and-push:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker
        run: docker build -t melisa-xdr:latest -f docker/Dockerfile .
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install melisa ./k8s/helm/melisa
          kubectl rollout status deployment/melisa
