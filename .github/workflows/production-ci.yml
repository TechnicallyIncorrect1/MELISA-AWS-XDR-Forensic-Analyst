name: MELISA Production CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run CodeQL
        uses: github/codeql-action/init@v3
      - uses: github/codeql-action/analyze@v3

  build:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
      - name: Build Docker
        run: docker build -t melisa-xdr:latest -f docker/Dockerfile .
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'melisa-xdr:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
